
{% extends "base.html" %}

{% block title %}Add Balance{% endblock %}

{% block content %}
    <h1>Add Balance</h1>
    <p class="muted">Current balance: ${{ profile.balance }}</p>

    <form method="post" class="simple-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Add funds (demo)</button>
    </form>
{% endblock %}
