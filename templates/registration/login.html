{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
    <h1>Login</h1>
    <form method="post" class="simple-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p class="muted">Don't have an account? <a href="{% url 'market:signup' %}">Sign up</a></p>
{% endblock %}
