{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
    <h1>Create an Account</h1>
    <form method="post" class="simple-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <p class="muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
